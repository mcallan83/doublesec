<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>DoubleSec</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f2ec;
        color: #222920;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(100% - 2rem, 46rem);
        margin: clamp(2rem, 8vw, 6rem) auto;
      }
      h1 {
        margin: 0;
        font:
          500 clamp(3rem, 10vw, 5rem)/1 Georgia,
          serif;
        letter-spacing: -0.06em;
      }
      header p {
        margin: 0.8rem 0 1.75rem;
        color: #4d594c;
      }
      form {
        background: #fffefa;
        border: 1px solid #d7dcd0;
        border-radius: 1rem;
        padding: clamp(1rem, 4vw, 2rem);
      }
      fieldset {
        display: grid;
        gap: 0.55rem;
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }
      label {
        font-weight: 650;
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border: 1px solid #b4bfb0;
        border-radius: 0.5rem;
        color: inherit;
        background: #fff;
      }
      textarea {
        resize: vertical;
        min-height: 7rem;
        font-family: ui-monospace, monospace;
      }
      .actions {
        display: flex;
        gap: 0.6rem;
        margin: 0.35rem 0 0.85rem;
      }
      button {
        padding: 0.55rem 1rem;
        border: 1px solid #275039;
        border-radius: 0.5rem;
        background: #275039;
        color: white;
        cursor: pointer;
      }
      button + button {
        background: transparent;
        color: #275039;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      :focus-visible {
        outline: 2px solid #416c50;
        outline-offset: 3px;
      }
      #status {
        margin: 0.65rem 0 0;
        min-height: 1.5em;
        color: #4d594c;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>DoubleSec</h1>
        <p>Encrypt and decrypt text in your browser using TripleSec v4.</p>
      </header>
      <form>
        <fieldset>
          <label for="password">Passphrase</label>
          <input type="password" id="password" autocomplete="off" required />
          <label for="input">Plaintext or hexadecimal ciphertext</label>
          <textarea id="input" spellcheck="false"></textarea>
          <div class="actions">
            <button value="encrypt">Encrypt</button>
            <button value="decrypt">Decrypt</button>
          </div>
          <label for="output">Result</label>
          <textarea id="output" readonly spellcheck="false"></textarea>
        </fieldset>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
